name: Export secrets

on:
  workflow_dispatch:

permissions: {}

# Set EXPORT_PASSPHRASE to a long, random, single-line repository secret first.
# Exports repository secrets and organization secrets accessible to this repo.
# To include environment secrets, add `environment: your-environment` to this job.
# After downloading and unzipping the artifact, decrypt locally (prompts for password):
# openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -in secrets.json.enc -out secrets.json
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Encrypt secrets
        shell: bash
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          EXPORT_PASSPHRASE: ${{ secrets.EXPORT_PASSPHRASE }}
        run: |
          : "${EXPORT_PASSPHRASE:?Set the EXPORT_PASSPHRASE repository secret first}"
          umask 077
          printf '%s' "$SECRETS_JSON" |
            jq 'del(.GITHUB_TOKEN, .EXPORT_PASSPHRASE)' |
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
              -pass env:EXPORT_PASSPHRASE -out "$RUNNER_TEMP/secrets.json.enc"

      - name: Upload encrypted export
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-secrets
          path: ${{ runner.temp }}/secrets.json.enc
          retention-days: 1
          if-no-files-found: error
